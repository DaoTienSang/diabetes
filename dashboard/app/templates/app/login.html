{% extends "app/base.html" %}
{% block content %}
<div class="card" style="max-width: 420px;">
  <h1>Đăng nhập Dashboard</h1>
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <p><input name="username" placeholder="username" style="width: 100%; box-sizing: border-box;"></p>
    <p><input name="password" type="password" placeholder="password" style="width: 100%; box-sizing: border-box;"></p>
    <button type="submit">Đăng nhập</button>
  </form>
  <p class="muted">Tài khoản demo:</p>
  <p class="muted">doctor / doctor123</p>
  <p class="muted">admin / admin123</p>
</div>
{% endblock %}
